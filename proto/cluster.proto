syntax = "proto3";

package cluster;

service ClusterService {
  rpc ClientWrite(WriteRequest) returns (WriteResponse);
  rpc Read(ReadRequest) returns (ReadResponse);
  rpc Status(StatusRequest) returns (StatusResponse);
  rpc Fetch(FetchRequest) returns (FetchResponse);
  rpc RequestVote(VoteRequest) returns (VoteResponse);
  rpc AnnounceLeader(LeaderAnnouncement) returns (LeaderAck);
}

message WriteRequest { string key = 1; string value = 2; }
message WriteResponse {
  bool success = 1;
  string message = 2;
  string leader = 3;
  int64 index = 4;
  int64 term = 5;
}
message ReadRequest { string key = 1; }
message ReadResponse {
  bool found = 1;
  string value = 2;
  string message = 3;
  string leader = 4;
  int64 commit_index = 5;
}
message StatusRequest {}
message StatusResponse {
  string node_id = 1;
  string role = 2;
  int64 term = 3;
  int64 commit_index = 4;
  int64 last_log_index = 5;
  string leader = 6;
}
message LogEntry {
  int64 index = 1;
  int64 term = 2;
  string key = 3;
  string value = 4;
}
message FetchRequest {
  string node_id = 1;
  int64 term = 2;
  int64 last_log_index = 3;
  int64 prev_log_index = 4;
  int64 prev_log_term = 5;
}
message FetchResponse {
  int64 term = 1;
  string leader = 2;
  repeated LogEntry entries = 3;
  int64 commit_index = 4;
  int64 leader_last_index = 5;
  bool success = 6;
  string message = 7;
  int64 next_index = 8;
  int64 matched_index = 9;
}
message VoteRequest {
  string candidate_id = 1;
  int64 term = 2;
  int64 last_log_index = 3;
  int64 last_log_term = 4;
}
message VoteResponse { int64 term = 1; bool vote_granted = 2; }
message LeaderAnnouncement {
  string leader_id = 1;
  int64 term = 2;
}
message LeaderAck { int64 term = 1; bool accepted = 2; }
