services:
  node1:
    build: .
    command: cluster.node
    environment:
      NODE_ID: node1
      NODE_ADDRESS: 0.0.0.0:50051
      PEERS: node2=node2:50052,node3=node3:50053,node4=node4:50054
      DATA_DIR: /data
    volumes: [node1-data:/data]
    ports: ["50051:50051"]
  node2:
    build: .
    command: cluster.node
    environment:
      NODE_ID: node2
      NODE_ADDRESS: 0.0.0.0:50052
      PEERS: node1=node1:50051,node3=node3:50053,node4=node4:50054
      DATA_DIR: /data
    volumes: [node2-data:/data]
    ports: ["50052:50052"]
  node3:
    build: .
    command: cluster.node
    environment:
      NODE_ID: node3
      NODE_ADDRESS: 0.0.0.0:50053
      PEERS: node1=node1:50051,node2=node2:50052,node4=node4:50054
      DATA_DIR: /data
    volumes: [node3-data:/data]
    ports: ["50053:50053"]
  node4:
    build: .
    command: cluster.node
    environment:
      NODE_ID: node4
      NODE_ADDRESS: 0.0.0.0:50054
      PEERS: node1=node1:50051,node2=node2:50052,node3=node3:50053
      DATA_DIR: /data
    volumes: [node4-data:/data]
    ports: ["50054:50054"]

volumes:
  node1-data:
  node2-data:
  node3-data:
  node4-data:
